<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    سنجه — a gauge. Dial arc, needle, pivot.

    On the dark ground rather than the site's white, because a favicon has to
    survive a light browser tab, a dark one and a bookmark bar, and a white
    square disappears into two of the three. The bright blue is the dark-ground
    variant of the accent, measured at 7.14:1 against this ink.

    Three shapes and no detail below 2px: at 16 square this still reads as a
    gauge, which nothing more elaborate would.
  -->
  <rect width="32" height="32" fill="#0E1116"/>
  <path d="M6.5 22 A 9.5 9.5 0 0 1 25.5 22" fill="none" stroke="#F2F4F7" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M16 22 L 23 11.5" stroke="#6E9DFF" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="16" cy="22" r="2.6" fill="#F2F4F7"/>
</svg>
